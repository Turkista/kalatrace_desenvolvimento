name: Tests

on:
  push:
    branches: ["main", "test/**"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest

      - name: Run ConflictSolver and KEE integration tests
        run: python -m pytest tests/test_conflict_solver.py tests/test_knowledge_evolution_conflict_integration.py tests/test_iec_contract_roundtrip.py tests/test_knowledge_evolution_persistence_sinks.py tests/test_epistemic_persistence_recovery.py tests/test_kee_persistence_recovery.py tests/test_request_persistence_context.py -q
