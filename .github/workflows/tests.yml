name: Tests

on:
  push:
    branches: ["main", "test/**"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest

      - name: Setup Node.js for frontend syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate inline JavaScript in index.html and login.html
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = [] if not attrs.get("src") and attrs.get("type", "").lower() not in {"application/json", "application/ld+json"} else None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      source = "".join(self.current).strip()
                      if source:
                          self.scripts.append(source)
                      self.current = None

          out = Path("/tmp/kalatrace-inline-js")
          out.mkdir(exist_ok=True)
          count = 0
          for html_path in (Path("index.html"), Path("login.html")):
              parser = InlineScripts()
              parser.feed(html_path.read_text(encoding="utf-8"))
              if not parser.scripts:
                  raise SystemExit(f"Nenhum JavaScript inline encontrado em {html_path}")
              for index, source in enumerate(parser.scripts, start=1):
                  (out / f"{html_path.stem}-script-{index}.js").write_text(source, encoding="utf-8")
              count += len(parser.scripts)
              print(f"{len(parser.scripts)} scripts inline preparados em {html_path}.")
          print(f"{count} scripts inline preparados para validação.")
          PY
          for file in /tmp/kalatrace-inline-js/*.js; do
            node --check "$file"
          done

      - name: Run ConflictSolver and KEE integration tests
        run: python -m pytest tests/test_conflict_solver.py tests/test_knowledge_evolution_conflict_integration.py tests/test_iec_contract_roundtrip.py tests/test_knowledge_evolution_persistence_sinks.py tests/test_epistemic_persistence_recovery.py tests/test_kee_persistence_recovery.py tests/test_request_persistence_context.py tests/test_epistemic_endpoint.py tests/test_epistemic_neutral_relation.py tests/test_auth_middleware.py tests/test_index_auth_contract.py tests/test_neo4j_connection_security.py tests/test_project_membership_access.py -q
