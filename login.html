<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/asset_eb3da0044c.png" type="image/png">
<title>Entrar no KALATRACE</title>
<style>
:root{color-scheme:light;--navy:#0b2a52;--blue:#1769b0;--teal:#0f8f86;--text:#2c2c2a;--muted:#666963;--border:#dfe4ea;--panel:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#1a4675 0,#0b2a52 45%,#06172e 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
main{width:min(100%,460px)}
.brand{text-align:center;color:#fff;margin-bottom:18px}
.brand img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 8px}
.brand p{margin:0;color:#c9d8e9;font-size:13px;letter-spacing:.04em}
.card{background:var(--panel);border:1px solid #ffffff50;border-radius:18px;padding:clamp(22px,5vw,34px);box-shadow:0 24px 70px #0003}
h1{font-size:25px;line-height:1.2;color:var(--navy);margin:0 0 8px}
.intro{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 20px}
.project{font-weight:650;color:var(--navy)}
label{display:block;font-size:13px;font-weight:650;margin:15px 0 6px}
input{font:inherit;font-size:16px;width:100%;min-height:46px;border:1px solid #c8d1db;border-radius:8px;padding:10px 12px;background:#fff;color:var(--text)}
input:focus{outline:3px solid #1769b032;border-color:var(--blue)}
.password-row{display:flex;gap:8px;align-items:stretch}
.password-row input{min-width:0;flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:#fff;color:var(--navy)}
#toggle-password{min-width:92px}
#submit-login{margin-top:22px;width:100%;min-height:48px;border:0;background:linear-gradient(90deg,var(--blue),var(--teal));color:#fff;font-weight:700}
#submit-login:disabled{opacity:.65;cursor:wait}
.status{min-height:22px;margin:14px 0 0;font-size:13px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.status.error{color:#a52828}.status.success{color:#23633b}
.back{display:block;margin:16px auto 0;text-align:center;color:#e3edf8;text-decoration:none;font-size:13px}
.back:hover{text-decoration:underline}
.security{font-size:11px;color:#6c7580;line-height:1.45;margin:16px 0 0}
@media(max-width:420px){body{padding:14px}.brand img{width:76px;height:76px}.card{border-radius:14px}.password-row{display:block}.password-row button{margin-top:8px;width:100%}}
</style>
</head>
<body>
<main>
  <header class="brand">
    <img src="assets/asset_eb3da0044c.png" alt="KALATRACE">
    <p>Infraestrutura cognitiva · Acesso seguro</p>
  </header>
  <section class="card" aria-labelledby="login-title">
    <h1 id="login-title">Entrar no KALATRACE</h1>
    <p class="intro">Informe as credenciais da sua conta para acessar o ambiente <span class="project" id="project-name">MEDIKALAT</span>.</p>
    <form id="login-form">
      <label for="login-email">E-mail</label>
      <input id="login-email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
      <label for="login-password">Senha</label>
      <div class="password-row">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button id="toggle-password" type="button" aria-pressed="false">Mostrar senha</button>
      </div>
      <button id="submit-login" type="submit">Entrar no projeto</button>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="security">A senha é enviada diretamente à API de autenticação do KALATRACE. Ela não é armazenada neste navegador.</p>
  </section>
  <a class="back" href="./index.html">Voltar à seleção de projetos</a>
</main>
<script>
(function(){
  'use strict';
  const API_BASE=String(window.KALATRACE_API_BASE||window.KT_API_BASE||'https://kalatrace-desenvolvimento.onrender.com').replace(/\/$/,'');
  const params=new URLSearchParams(window.location.search);
  const allowedProjects=new Set(['medikalat','robotica','agente-local']);
  const requested=params.get('continue')||'medikalat';
  const project=allowedProjects.has(requested)?requested:'medikalat';
  const names={medikalat:'MEDIKALAT',robotica:'Robótica','agente-local':'Agente Local'};
  const projectName=document.getElementById('project-name');
  const form=document.getElementById('login-form');
  const email=document.getElementById('login-email');
  const password=document.getElementById('login-password');
  const submit=document.getElementById('submit-login');
  const status=document.getElementById('login-status');
  const toggle=document.getElementById('toggle-password');
  if(projectName)projectName.textContent=names[project]||'MEDIKALAT';
  function setStatus(message,kind){
    status.textContent=message||'';
    status.className='status'+(kind?' '+kind:'');
  }
  async function api(path,options){
    options=options||{};
    const headers=Object.assign({'Content-Type':'application/json'},options.headers||{});
    let token='';
    try{token=sessionStorage.getItem('kalatrace_access_token')||''}catch(_){}
    if(token)headers.Authorization='Bearer '+token;
    let response;
    try{
      response=await fetch(API_BASE+path,Object.assign({},options,{headers:headers}));
    }catch(_){
      throw new Error('Não foi possível conectar à API do KALATRACE. Tente novamente em instantes.');
    }
    const data=await response.json().catch(function(){return {}});
    if(!response.ok){
      const error=new Error(data.detail||data.message||('HTTP '+response.status));
      error.status=response.status;
      throw error;
    }
    return data;
  }
  toggle.addEventListener('click',function(){
    const visible=password.type==='password';
    password.type=visible?'text':'password';
    toggle.textContent=visible?'Ocultar senha':'Mostrar senha';
    toggle.setAttribute('aria-pressed',String(visible));
  });
  form.addEventListener('submit',async function(event){
    event.preventDefault();
    if(!form.reportValidity()||submit.disabled)return;
    submit.disabled=true;
    setStatus('Autenticando sua conta…');
    try{
      let data;
      try{
        data=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});
      }catch(error){
        if(error.status===400||error.status===401)throw new Error('Não foi possível entrar. Confira o e-mail, a senha e se o e-mail da conta está confirmado.');
        throw error;
      }
      const token=data.access_token||(data.session&&data.session.access_token);
      if(!token)throw new Error('A API não retornou um token de acesso.');
      try{sessionStorage.setItem('kalatrace_access_token',token)}catch(_){throw new Error('O navegador bloqueou a sessão segura. Permita o armazenamento de sessão e tente novamente.')}
      await api('/auth/me');
      setStatus('Acesso confirmado. Abrindo o ambiente…','success');
      const nextUrl=new URL('index.html',window.location.href);
      nextUrl.searchParams.set('enterProject',project);
      window.location.replace(nextUrl.href);
    }catch(error){
      setStatus(error&&error.message?error.message:'Ocorreu um erro durante a autenticação.','error');
      try{sessionStorage.removeItem('kalatrace_access_token')}catch(_){}
    }finally{
      submit.disabled=false;
    }
  });
  email.focus();
})();
</script>
</body>
</html>
